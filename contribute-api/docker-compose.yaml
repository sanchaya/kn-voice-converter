services:
  api:
    build: .
    restart: unless-stopped
    expose:
      - "8000"   # no host port: Coolify's proxy routes the domain to this port
    environment:
      - ALLOWED_ORIGIN=https://dani.sanchaya.net
    volumes:
      - kn-contribute-data:/data   # audio and the SQLite database; survives redeploys
volumes:
  kn-contribute-data:
